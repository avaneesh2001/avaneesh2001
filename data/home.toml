eyebrow = "About"
headline = "About me"
body = """I’m a Senior Engineer at Qualcomm in Chennai, focused on code intelligence, backend systems, automation, and applied AI.
At Qualcomm, I extend an internal code intelligence platform with SystemC support, component search, MCP workflows, and integrations across SDK and backend layers. Previously at Truminds, I worked across telecom testing systems, large-scale code analysis, and LLM-based developer tooling. My work ranges from building a dependency graph system that has served 3M+ queries for 3k+ engineers across 7k+ repositories to designing pipelines that generate unit tests using large language models.
I enjoy working on problems that sit between systems and intelligence. Things like code understanding, automation at scale, and building tools that make developers faster.
I tend to take ownership end-to-end, from design to deployment, and I’m comfortable working in ambiguous problem spaces."""
side_note = "Exploring how AI can automate complex engineering tasks at scale"

